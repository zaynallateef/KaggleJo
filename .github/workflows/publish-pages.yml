name: Refresh data and publish Pages

'on':
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      snapshot_name: public-snapshot-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-data.txt
      - run: python -m pip install -r backend/requirements.lock -r backend/requirements-data.txt
      - name: Verify Kaggle SDK imports
        run: python -c "from kaggle.api.kaggle_api_extended import KaggleApi; from kagglesdk.search.types.search_api_service import ListEntitiesRequest, ListEntitiesFilters, ApiSearchUsersFilters; from kagglesdk.search.types.search_enums import DocumentType, PrivacyFilter; from kagglesdk.users.types.search_users import SearchUsersOrderBy"
      - run: python -m unittest discover -s backend/tests -v
      - name: Fetch fresh public Jordan profiles
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLEJO_MODE: production
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python -c "import os; assert os.environ.get('KAGGLE_API_TOKEN'), 'Add the KAGGLE_API_TOKEN repository secret before publishing.'"
          if [ -n "$SUPABASE_URL" ]; then
            python -m backend.kaggle_source --db data/publish.db --with-supabase
          else
            python -m backend.kaggle_source --db data/publish.db
          fi
      - name: Export public fields only
        run: python -m backend.export_static --db data/publish.db --output public/data/snapshot.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-snapshot-${{ github.run_attempt }}
          path: public/data/snapshot.json
          if-no-files-found: error
          retention-days: 1

  build:
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pages_name: github-pages-${{ github.run_attempt }}
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.data.outputs.snapshot_name }}
          path: public/data
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build:pages
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the completed build
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ needs.build.outputs.pages_name }}
